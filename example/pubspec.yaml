name: flutter_invoice_generator_example
description: "Demo app for flutter_invoice_generator."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  # The package itself, from the parent folder.
  flutter_invoice_generator:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs tests inside the real app on a device or desktop.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
